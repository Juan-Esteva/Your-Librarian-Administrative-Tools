<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>dcLibrary 2.0 Template</title>
<style>
#dcDialogOverlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.30);
    z-index:99999;
}
#dcDialog{width:420px;overflow:hidden;}
#dcDialog.dcClassic{background:#fff;border:1px solid #999;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.25);}

/*         THEME MODERN         */

#dcDialog.dcModern{

    background:rgba(70,185,220,.58);
    color:#F8FBFD;
    border:1px solid rgba(255,255,255,.18);
    border-radius:22px;
    box-shadow:
        0 18px 45px rgba(0,0,0,.28);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

}

#dcDialog.dcModern #dcDialogHeader{

    padding:24px 28px 8px 28px;

    background:transparent;

    border:none;

}

#dcDialog.dcModern #dcDialogBody{

    padding:28px;

    color:rgba(255,255,255,.96);

    font-size:17px;

    line-height:1.6;

}

#dcDialog.dcModern #dcDialogButtons{

    padding:8px 26px 24px;

    background:transparent;

    border:none;

    text-align:right;

}

#dcDialog.dcModern button{

    min-width:120px;

    height:42px;

    margin-left:12px;

    border:none;

    border-radius:12px;

    background:rgba(255,255,255,.92);

    color:#5D6F79;

    font-size:15px;

    font-weight:500;

    transition:.20s;

}

#dcDialog.dcModern button:hover{

    background:white;

}

#dcDialog.dcModern input{

    width:100%;

    box-sizing:border-box;

    margin-top:16px;

    padding:12px 14px;

    border:none;

    border-radius:10px;

    background:rgba(255,255,255,.96);

    color:#555;

    font-size:15px;

}



#dcDialogHeader{padding:12px;font-weight:bold;}
#dcDialogBody{padding:18px;line-height:1.5;}
#dcDialogButtons{padding:10px;text-align:right;}
</style>
</head>
<body>
<div id="dcDialogOverlay">
<div id="dcDialog" class="dcClassic">
<div id="dcDialogHeader"></div>
<div id="dcDialogBody"></div>
<div id="dcDialogButtons"></div>
</div>
</div>
<script>

const DC_THEME_CLASSIC=0;
const DC_THEME_MODERN=1;
let dcTheme=DC_THEME_MODERN;

const DC_VERSION = "2.0";

/* Variables privadas */

let dcOverlay;
let dcDialogBox;
let dcHeader;
let dcBody;
let dcButtons;

function dcInit(){

    dcOverlay   = document.getElementById("dcDialogOverlay");
    dcDialogBox = document.getElementById("dcDialog");
    dcHeader    = document.getElementById("dcDialogHeader");
    dcBody      = document.getElementById("dcDialogBody");
    dcButtons   = document.getElementById("dcDialogButtons");

}

function dcSetTheme(theme){
  dcTheme=theme;
  const d=document.getElementById("dcDialog");
  d.classList.remove("dcClassic","dcModern");
  d.classList.add(theme===DC_THEME_MODERN?"dcModern":"dcClassic");
}
dcSetTheme(dcTheme);

function dcSetTitle(title){

    dcHeader.innerHTML =

        '<div style="position:relative;">'+

            '<div style="'+
                'font-size:80px;'+
                'font-weight:900;'+
                'line-height:.85;'+
                'letter-spacing:-2px;'+
                'color:#ffffff;'+
            '">'+
                'ylat'+
            '</div>'+

            '<div style="'+
                'margin-top:18px;'+
                'font-size:12px;'+
                'font-weight:600;'+
                'color:#F4FBFD;'+
            '">'+
                title+
            '</div>'+

            '<div style="'+
                'position:absolute;'+
                'right:0;'+
                'top:8px;'+
                'font-size:11px;'+
                'color:#E8F4F8;'+
            '">'+
                'v'+DC_VERSION+
            '</div>'+

        '</div>';

}

function dcSetBody(html){

    dcBody.innerHTML = html;

}

function dcSetButtons(html){

    dcButtons.innerHTML = html;

}

function dcBindButton(id,handler){

    document.getElementById(id).onclick = handler;

}

function dcPrepareDialog(title,body){

    dcSetTitle(title);

    dcSetBody(body);

}

function dcShow(){

    dcOverlay.style.display = "flex";

}

function dcHide(){

    dcOverlay.style.display = "none";

}

function dcCloseDialog(){

    dcHide();

}

function dcAlert(message,title="Información"){

    dcPrepareDialog(title,message);

    dcSetButtons(
    '<button id="dcAccept">Aceptar</button>'
);

    dcBindButton(
    "dcAccept",
    dcCloseDialog
);

    dcShow();

}

function dcConfirm(message,callback,title="Confirmar"){

    dcPrepareDialog(title,message);

    dcSetButtons(

    '<button id="dcCancel">Cancelar</button>' +

    '<button id="dcAccept">Aceptar</button>'

);

    dcShow();

    dcBindButton(
    "dcCancel",
    function(){

        dcCloseDialog();

        callback(false);

    }
);

dcBindButton(
    "dcAccept",
    function(){

        dcCloseDialog();

        callback(true);

    }
);

}

function dcPrompt(message,defaultValue="",title="Entrada"){

    return new Promise(function(resolve){

        dcPrepareDialog(

    title,

    message +

    '<br><input id="dcPromptInput" value="' +

    defaultValue +

    '>'

);

        dcSetButtons(

    '<button id="dcCancel">Cancelar</button>' +

    '<button id="dcAccept">Aceptar</button>'

);

        dcShow();

        document.getElementById("dcPromptInput").focus();

        document.getElementById("dcCancel").onclick =

            function(){

                dcCloseDialog();

                resolve(null);

            };

        document.getElementById("dcAccept").onclick =

            function(){

                const value =

                    document.getElementById(
                        "dcPromptInput"
                    ).value;

                dcCloseDialog();

                resolve(value);

            };

    });

}

function dcDialog(title,html){

    dcPrepareDialog(title,html);

    dcSetButtons(

    '<button id="dcClose">Cerrar</button>'

);

    dcBindButton(
    "dcClose",
    dcCloseDialog
);

    dcShow();

}

function dcList(title,items){

    return new Promise(function(resolve){

        let html = "";

        items.forEach(function(item,index){

            html +=

                '<div class="dcListItem" '+
                'style="padding:8px;border-bottom:1px solid #ddd;cursor:pointer;" '+
                'onclick="dcListSelect('+index+')">'+

                item.text+

                '</div>';

        });

        window.dcListItems   = items;
        window.dcListResolve = resolve;

        dcDialog(title,html);

    });

}

function dcListSelect(index){

    const item = window.dcListItems[index];

    dcCloseDialog();

    if(window.dcListResolve){

        window.dcListResolve(item.id);

        window.dcListResolve = null;
        window.dcListItems   = null;

    }

}

dcInit();
dcSetTheme(dcTheme);
</script>
</body>
</html>
