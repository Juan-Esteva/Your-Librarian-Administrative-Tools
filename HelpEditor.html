    id="helpImageSizer"
    style="
        display:none;
        margin-top:8px;

<script>

    
    let currentLanguage = null;

    let currentMode = "HELP";

    let currentCommand = null;


function clearHelp(){

    if(currentMode==="TEMPLATE"){

        dcConfirm(

            "¿Desea borrar completamente la plantilla?",

            function(ok){

    if(!ok) return;


                document.getElementById("helpDocument").innerHTML="";

                document.getElementById("helpDocument").focus();

            }

        );

        return;

    }

    if(!currentCommand){

        dcAlert("No hay ningún comando seleccionado.");

        return;

    }

    dcConfirm(

        '¿Desea borrar completamente la ayuda del comando "' +

        currentCommand +

        '"?',

        function(ok){

    if(!ok) return;


            document.getElementById("helpDocument").innerHTML="";

            document.getElementById("helpDocument").focus();

        }

    );

}



//
// Lista de comandos
//

function buildCommandList(commands){

    const panel = document.getElementById("helpCommandsList");

    panel.innerHTML = "";

    commands.forEach(cmd=>{

        const div = document.createElement("div");

        div.className = "helpCommand";

        div.textContent = cmd;

        div.addEventListener("click", function(){

            selectCommand(cmd, div);

        });

        panel.appendChild(div);

    });

}

/*    Idiomas    */


function loadLanguageSelector(language){

    currentLanguage = language || "ES";

    const selector =

        document.getElementById(
            "languageSelector"
        );

    selector.innerHTML = "";

    HELP_LANGUAGES.forEach(function(lang){

        const option =

            document.createElement("option");

        option.value = lang;
        option.textContent = lang;

        if(lang===currentLanguage)
            option.selected = true;

        selector.appendChild(option);

    });


}

function changeLanguage(language){

    currentLanguage = language;

    if(currentMode==="TEMPLATE"){

        editTemplate();

        return;

    }

    if(currentCommand){

        const selected =

            document.querySelector(
                "#helpCommandsList .helpCommand.selected"
            );

        if(selected){

            selectCommand(
                currentCommand,
                selected
            );

        }

    }

}

function selectCommand(cmd, element){

    currentMode = "HELP";
    
    currentCommand = cmd;

    document
        .querySelectorAll("#helpCommandsList .helpCommand")
        .forEach(item => item.classList.remove("selected"));

    element.classList.add("selected");

    setStatus("Cargando ayuda...");

    google.script.run

        .withSuccessHandler(function(help){

            document.getElementById("helpDocument").innerHTML =
                help.html;

            setStatus("Editor de Ayuda");

        

        })

        .withFailureHandler(function(err){

            setStatus("Error");

            dcAlert(err.message,"Error");

        })

        .YLGetHelp(

    cmd,

    currentLanguage

);

}
//
// Documento
//

//
// Utilidades
//

function saveHelp(){

    const html =
        document.getElementById("helpDocument").innerHTML;

    setStatus("Guardando...",true);

    if(currentMode==="TEMPLATE"){

        google.script.run

            .withSuccessHandler(function(){

                setStatus("Plantilla guardada");

                setTimeout(function(){

                    setStatus("Editando plantilla");

                },1500);

            })

            .withFailureHandler(function(err){

                setStatus("Error");

                dcAlert(
                    err.message,
                    "Plantilla"
                );

            })

            .YLSaveTemplate(

                currentLanguage,

                html

            );

        return;

    }

    if(!currentCommand){

        dcAlert(
            "No hay ningún comando seleccionado."
        );

        setStatus("Editor de Ayuda");

        return;

    }

    google.script.run

        .withSuccessHandler(function(){

            setStatus("Guardado");

            setTimeout(function(){

                setStatus("Editor de Ayuda");

            },1500);

        })

        .withFailureHandler(function(err){

            setStatus("Error");

            dcAlert(
                err.message,
                "Error guardando"
            );

        })

        .YLSaveCurrentHelp(

            currentCommand,

            html,

            currentLanguage

        );

}

  
function editTemplate(){

    currentMode = "TEMPLATE";

    google.script.run

        .withSuccessHandler(function(html){

            document.getElementById("helpDocument").innerHTML = html;

            setStatus("Editando plantilla");

        })

        .withFailureHandler(function(err){

            dcAlert(err.message,"Plantilla");

        })

        .YLGetTemplate(currentLanguage);

}

  
function insertTemplate(){

    google.script.run

        .withSuccessHandler(function(html){

            helpInsertHTML(html);

        })

        .withFailureHandler(function(err){

            dcAlert(
                err.message,
                "Plantilla"
            );

        })

        .YLGetTemplate(currentLanguage);

}
  
function restoreTemplate(){

    dcConfirm(

        "¿Desea restaurar la plantilla original?\n\nSe perderán todas las modificaciones realizadas a la plantilla actual.",

        function(ok){

    if(!ok) return;


            setStatus("Restaurando plantilla...",true);

            google.script.run

                .withSuccessHandler(function(html){

                    document.getElementById("helpDocument").innerHTML = html;

                    currentMode = "TEMPLATE";

                    setStatus("Plantilla restaurada");

                    setTimeout(function(){

                        setStatus("Editando plantilla");

                    },1500);

                })

                .withFailureHandler(function(err){

                    setStatus("Error");

                    dcAlert(err.message,"Plantilla");

                })

                .YLRestoreTemplate(currentLanguage);

        }

    );

}

function helpEditorClick(ev){


    if(ev.target.tagName==="IMG"){

        if(helpCurrentImage)

            helpCurrentImage.style.outline = "none";

        helpCurrentImage = ev.target;

        helpCurrentImage.style.outline =
            "2px solid #3b82f6";

        helpShowImageSizer(helpCurrentImage);

    }
    else{

        if(helpCurrentImage){

            helpCurrentImage.style.outline = "none";

            helpCurrentImage = null;

        }

        helpHideImageSizer();

    }

}

function helpShowImageSizer(img){

    const sizer =
        document.getElementById("helpImageSizer");

    const slider =
        document.getElementById("helpImageSlider");

    const value =
        document.getElementById("helpImageValue");

    let percent = 100;

    if(img.style.width &&
       img.style.width.endsWith("%")){

        percent =
            parseInt(img.style.width,10);

    }

    slider.value = percent;

    value.textContent =
        percent + "%";

    sizer.style.display =
        "block";

    document.addEventListener(
    "keydown",
    helpImageSizerKeyDown
);

}

function helpHideImageSizer(){

    document
        .getElementById("helpImageSizer")
        .style.display = "none";

    document.removeEventListener(
        "keydown",
        helpImageSizerKeyDown
    );

}

function helpUpdateImageSize(){

    if(!helpCurrentImage)
        return;

    const slider =
        document.getElementById("helpImageSlider");

    const value =
        document.getElementById("helpImageValue");

    const percent =
        parseInt(slider.value,10);

    value.textContent =
        percent + "%";

    helpCurrentImage.style.width =
        percent + "%";

    helpCurrentImage.style.height =
        "auto";

}

  function helpImageSizerKeyDown(ev){

    if(ev.key !== "Delete" &&
   ev.key !== "Backspace")
    return;

    if(!helpCurrentImage)
        return;

    ev.preventDefault();

    dcConfirm(

        "¿Eliminar la imagen seleccionada?",

        function(ok){

    if(!ok) return;


            helpCurrentImage.remove();

            helpCurrentImage = null;

            helpHideImageSizer();

        },

        "Editor de Ayuda"

    );

  }


</script>
